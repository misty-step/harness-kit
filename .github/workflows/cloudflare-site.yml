name: Cloudflare static site
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-static-site
  cancel-in-progress: false
jobs:
  static-site:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      ROLLBACK_PROBE: __migration_rollback_probe_t_c60b5646.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Preserve adapter and identify immutable source
        id: source
        run: |
          cp -R cloudflare "$RUNNER_TEMP/cloudflare-site-adapter"
          printf 'revision=%s\n' "$(node -p 'require("./cloudflare/site.json").source_commit')" >> "$GITHUB_OUTPUT"
          printf 'PREVIEW_BASE=https://%s.misty-step.workers.dev\n' "$(node -p 'require("./cloudflare/wrangler.json").name')" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - run: cp -R "$RUNNER_TEMP/cloudflare-site-adapter" cloudflare
      - name: Existing Rust-owned docs build and gate
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 scripts/build-docs-site.sh
          RUSTUP_TOOLCHAIN=1.98.1 scripts/check-docs-site.sh --self-test
          source=$(node -p 'require("./cloudflare/site.json").source_folder')
          while read -r digest file; do
            rel=${file#_site/harness-kit/}
            mkdir -p "$(dirname "$file")"
            cp "$source/$rel" "$file"
          done < cloudflare/files.sha256
          printf '/ /harness-kit/ 302\n' > _site/_redirects
          sha256sum --check cloudflare/files.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-static-assets
          path: _site
          retention-days: 90
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: preview_a
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: deploy --config cloudflare/wrangler.json
      - name: Record immutable native version review identity
        env:
          WRANGLER_OUTPUT: ${{ steps.preview_a.outputs.command-output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          config = json.loads(Path('cloudflare/wrangler.json').read_text())
          versions = re.findall(r'Current Version ID: ([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?=\s|$)', os.environ['WRANGLER_OUTPUT'])
          assert len(versions) == 1, 'Expected exactly one native version identity'
          version = versions[0]
          url = 'https://' + version[:8] + '-' + config['name'] + '.misty-step.workers.dev'
          proof = {'version': version, 'url': url, 'run': os.environ['GITHUB_RUN_ID'],
                   'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'workflow_revision': os.environ['GITHUB_SHA']}
          Path('preview-identity.json').write_text(json.dumps(proof, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('REVIEW_URL=' + url + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Immutable review: ' + url + '\n\nVersion: ' + version + '\n')
          print(json.dumps(proof))
          PY
      - name: Establish A then stage synthetic preview B
        run: |
          ready=0
          for sample in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' "$PREVIEW_BASE/$ROLLBACK_PROBE")
            printf '%s %s\n' "$sample" "$code" >> rollback-absent.txt
            if test "$code" = 404; then ready=$((ready+1)); else ready=0; fi
            test "$ready" -lt 2 || break
            sleep 5
          done
          test "$ready" = 2
          printf 'synthetic static-preview rollback probe t_c60b5646\n' > "_site/$ROLLBACK_PROBE"
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: synthetic_deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: deploy --config cloudflare/wrangler.json
      - name: Observe synthetic B with bounded recorded readiness
        run: |
          ready=0
          for sample in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 15 --output "$RUNNER_TEMP/probe-body" --write-out '%{http_code}' "$PREVIEW_BASE/$ROLLBACK_PROBE")
            printf '%s %s\n' "$sample" "$code" >> rollback-visible.txt
            if test "$code" = 200 && cmp --silent "$RUNNER_TEMP/probe-body" "_site/$ROLLBACK_PROBE"; then ready=$((ready+1)); else ready=0; fi
            test "$ready" -lt 2 || break
            sleep 5
          done
          test "$ready" = 2
      - name: Verify immutable A while B is live
        run: |
          while read -r digest file; do
            curl --fail --silent --show-error --location --max-time 30 "$REVIEW_URL/${file#_site/}" --output "$RUNNER_TEMP/site-object"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/site-object" | sha256sum --check --status
            printf '%s %s\n' "$digest" "${file#_site/}" >> preview-version-proof.txt
          done < cloudflare/files.sha256
          code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$REVIEW_URL/$ROLLBACK_PROBE")
          printf '%s %s\n' "$REVIEW_URL/$ROLLBACK_PROBE" "$code" > native-version-isolation.txt
          test "$code" = 404
      - name: Native rollback to verified A
        if: always() && steps.synthetic_deploy.conclusion == 'success'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: rollback --config cloudflare/wrangler.json --yes
      - name: Verify restored A and every public object
        if: always() && steps.synthetic_deploy.conclusion == 'success'
        run: |
          ready=0
          for sample in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' "$PREVIEW_BASE/$ROLLBACK_PROBE")
            printf '%s %s\n' "$sample" "$code" >> rollback-restored.txt
            if test "$code" = 404; then ready=$((ready+1)); else ready=0; fi
            test "$ready" -lt 2 || break
            sleep 5
          done
          test "$ready" = 2
          rm "_site/$ROLLBACK_PROBE"
          sha256sum --check cloudflare/files.sha256
          while read -r digest file; do
            curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_BASE/${file#_site/}" --output "$RUNNER_TEMP/site-object"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/site-object" | sha256sum --check --status
            printf '%s %s\n' "$digest" "${file#_site/}" >> cloudflare-http-proof.txt
          done < cloudflare/files.sha256
          test "$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$PREVIEW_BASE/__migration_missing_t_c60b5646__")" = 404
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloudflare-http-proof
          path: |
            cloudflare-http-proof.txt
            preview-identity.json
            preview-version-proof.txt
            native-version-isolation.txt
            rollback-*.txt
          if-no-files-found: ignore

      - name: Refuse stale default-branch promotion
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUDFLARE_SITE_PROMOTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Promote the identical verified artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUDFLARE_SITE_PROMOTED == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: deploy --config cloudflare/wrangler.json --env production
      - name: Verify canonical production bytes
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUDFLARE_SITE_PROMOTED == 'true'
        run: |
          host=$(node -p 'require("./cloudflare/wrangler.json").env.production.routes[0].pattern')
          while read -r digest file; do
            curl --fail --silent --show-error --location --max-time 30 "https://$host/${file#_site/}" --output "$RUNNER_TEMP/site-object"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/site-object" | sha256sum --check --status
          done < cloudflare/files.sha256
