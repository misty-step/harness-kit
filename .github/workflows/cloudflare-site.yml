name: Cloudflare static site
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-static-site
  cancel-in-progress: false
jobs:
  static-site:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      ROLLBACK_PROBE: __migration_rollback_probe_t_c60b5646.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bound owned previews before allocating another
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RETAINED_REVIEW_PREVIEW: harness-kit-site-preview-38798173356-1
          LEGACY_PREVIEW_RUN: '38790696529'
        run: |
          python3 - --apply <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          def plan(names, runs, prefix, pinned, current_id, current_attempt, workflow_id):
              receipts = {r['id']: r for r in runs}
              pattern = re.compile(re.escape(prefix) + r'-([1-9][0-9]*)-([1-9][0-9]*)')
              current = f'{prefix}-{current_id}-{current_attempt}'
              completed = []
              for name in names:
                  match = pattern.fullmatch(name)
                  if not match:
                      continue
                  run_id, attempt = map(int, match.groups())
                  run = receipts.get(run_id)
                  if not run or run['workflow_id'] != workflow_id or run['path'] != '.github/workflows/cloudflare-site.yml' or attempt > run['run_attempt']:
                      raise RuntimeError('Unattributed preview: ' + name)
                  if name == current:
                      continue
                  if run['status'] != 'completed' and not (run_id == current_id and attempt < current_attempt):
                      raise RuntimeError('Another preview is still running: ' + name)
                  completed.append((run_id, attempt, name))
              newest = {row[2] for row in sorted(completed)[-2:]}
              keep = newest | {pinned, current}
              return keep, sorted(row[2] for row in completed if row[2] not in keep)

          def main():
              if '--apply' in sys.argv and os.environ.get('GITHUB_ACTIONS') != 'true':
                  raise RuntimeError('Deletion is CI-only; local inspection is read-only')
              config = json.loads(Path('cloudflare/wrangler.json').read_text())
              repo = os.environ['GITHUB_REPOSITORY']
              prefix = repo.split('/')[1] + '-site-preview'
              if config['name'] != prefix:
                  raise RuntimeError('Cleanup must run before run-name allocation')
              pinned = os.environ['RETAINED_REVIEW_PREVIEW']
              if not re.fullmatch(re.escape(prefix) + r'-[1-9][0-9]*-[1-9][0-9]*', pinned):
                  raise RuntimeError('Invalid retained review identity')
              token = os.environ['CLOUDFLARE_API_TOKEN']
              api = 'https://api.cloudflare.com/client/v4/accounts/' + config['account_id'] + '/workers/scripts'

              def cf(suffix='', method='GET'):
                  request = urllib.request.Request(api + suffix, method=method, headers={'Authorization': 'Bearer ' + token})
                  try:
                      response = urllib.request.urlopen(request, timeout=30)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  with response:
                      body = json.load(response)
                      if response.status == 404 and any(e.get('code') == 10007 for e in body.get('errors', [])):
                          return None
                      if response.status != 200 or not body.get('success'):
                          raise RuntimeError(f'Cloudflare {method} failed: HTTP {response.status}')
                      return body['result']

              command = ['gh', 'api', '--paginate', '--slurp', f'repos/{repo}/actions/workflows/cloudflare-site.yml/runs?per_page=100']
              pages = json.loads(subprocess.check_output(command, text=True))
              runs = [r for page in pages for r in page['workflow_runs']]
              if len(runs) != pages[0]['total_count'] or len({r['id'] for r in runs}) != len(runs):
                  raise RuntimeError('Incomplete workflow run inventory')
              current_id, current_attempt = int(os.environ['GITHUB_RUN_ID']), int(os.environ['GITHUB_RUN_ATTEMPT'])
              current = next(r for r in runs if r['id'] == current_id)
              names = {row['id'] for row in cf()}
              keep, delete = plan(names, runs, prefix, pinned, current_id, current_attempt, current['workflow_id'])
              # Exact original migration Actions provider-output attribution.
              if prefix in names:
                  legacy = next(r for r in runs if r['id'] == int(os.environ['LEGACY_PREVIEW_RUN']))
                  if legacy['workflow_id'] != current['workflow_id'] or legacy['status'] != 'completed':
                      raise RuntimeError('Unattributed legacy preview')
                  delete.append(prefix)
              protected = [repo.split('/')[1] + '-site', pinned]
              before = {name: cf('/' + name + '/deployments') for name in protected}
              if not all(before.values()):
                  raise RuntimeError('Missing canonical or accepted review identity')
              proof = {'repo': repo, 'keep': sorted(keep), 'candidates': delete, 'deleted': [], 'apply': '--apply' in sys.argv}
              path = Path(os.environ.get('RUNNER_TEMP', '.')) / 'preview-retention-proof.json'
              path.write_text(json.dumps(proof, indent=2) + '\n')
              print(json.dumps(proof), flush=True)
              for name in delete if proof['apply'] else []:
                  cf('/' + name, 'DELETE')
                  if cf('/' + name + '/deployments') is not None:
                      raise RuntimeError('Provider deletion readback failed: ' + name)
                  deadline = time.monotonic() + 90
                  while True:
                      url = 'https://' + name + '.misty-step.workers.dev/?deleted=' + str(time.time_ns())
                      try:
                          response = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'MistyStep-static-site-parity/1.0 (+https://foundations.mistystep.io/)', 'Cache-Control': 'no-cache'}), timeout=15)
                      except urllib.error.HTTPError as exc:
                          response = exc
                      with response:
                          status = response.status
                          body = response.read(16384)
                      proof.setdefault('http_observations', {}).setdefault(name, []).append({'status': status, 'missing_worker_1042': b'1042' in body})
                      path.write_text(json.dumps(proof, indent=2) + '\n')
                      if status == 404 and b'1042' in body:
                          break
                      if time.monotonic() >= deadline:
                          raise RuntimeError('HTTP deletion readback failed: ' + name)
                      time.sleep(5)
                  proof['deleted'].append({'name': name, 'provider': 404, 'http': status})
                  path.write_text(json.dumps(proof, indent=2) + '\n')
              if {name: cf('/' + name + '/deployments') for name in protected} != before:
                  raise RuntimeError('Canonical or retained review deployment changed')
              proof['protected_deployments'] = before
              proof['protected_unchanged'] = True
              proof['remaining'] = sorted(row['id'] for row in cf() if row['id'] == prefix or re.fullmatch(re.escape(prefix) + r'-[1-9][0-9]*-[1-9][0-9]*', row['id']))
              if proof['apply'] and not set(proof['remaining']) <= keep:
                  raise RuntimeError('Preview bound readback failed')
              path.write_text(json.dumps(proof, indent=2) + '\n')
              print('Preview bound verified; canonical and retained review unchanged', flush=True)

          if __name__ == '__main__':
              main()
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Preserve adapter and identify immutable source
        id: source
        run: |
          node -e 'const fs=require("node:fs"); const p="cloudflare/wrangler.json"; const c=JSON.parse(fs.readFileSync(p)); c.name += "-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT; fs.writeFileSync(p, JSON.stringify(c,null,2)+"\n"); console.log("Preview: https://"+c.name+".misty-step.workers.dev");'
          cp -R cloudflare "$RUNNER_TEMP/cloudflare-site-adapter"
          printf 'revision=%s\n' "$(node -p 'require("./cloudflare/site.json").source_commit')" >> "$GITHUB_OUTPUT"
          printf 'PREVIEW_BASE=https://%s.misty-step.workers.dev\n' "$(node -p 'require("./cloudflare/wrangler.json").name')" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - run: cp -R "$RUNNER_TEMP/cloudflare-site-adapter" cloudflare
      - name: Existing Rust-owned docs build and gate
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 scripts/build-docs-site.sh
          RUSTUP_TOOLCHAIN=1.98.1 scripts/check-docs-site.sh --self-test
          source=$(node -p 'require("./cloudflare/site.json").source_folder')
          while read -r digest file; do
            rel=${file#_site/harness-kit/}
            mkdir -p "$(dirname "$file")"
            cp "$source/$rel" "$file"
          done < cloudflare/files.sha256
          printf '/ /harness-kit/ 302\n' > _site/_redirects
          sha256sum --check cloudflare/files.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-static-assets
          path: _site
          retention-days: 90
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: deploy --config cloudflare/wrangler.json
      - name: Establish A then stage synthetic preview B
        run: |
          ready=0
          for sample in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' "$PREVIEW_BASE/$ROLLBACK_PROBE")
            printf '%s %s\n' "$sample" "$code" >> rollback-absent.txt
            if test "$code" = 404; then ready=$((ready+1)); else ready=0; fi
            test "$ready" -lt 2 || break
            sleep 5
          done
          test "$ready" = 2
          printf 'synthetic static-preview rollback probe t_c60b5646\n' > "_site/$ROLLBACK_PROBE"
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: synthetic_deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: deploy --config cloudflare/wrangler.json
      - name: Observe synthetic B with bounded recorded readiness
        run: |
          ready=0
          for sample in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 15 --output "$RUNNER_TEMP/probe-body" --write-out '%{http_code}' "$PREVIEW_BASE/$ROLLBACK_PROBE")
            printf '%s %s\n' "$sample" "$code" >> rollback-visible.txt
            if test "$code" = 200 && cmp --silent "$RUNNER_TEMP/probe-body" "_site/$ROLLBACK_PROBE"; then ready=$((ready+1)); else ready=0; fi
            test "$ready" -lt 2 || break
            sleep 5
          done
          test "$ready" = 2
      - name: Native rollback to verified A
        if: always() && steps.synthetic_deploy.conclusion == 'success'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: rollback --config cloudflare/wrangler.json --yes
      - name: Verify restored A and every public object
        if: always() && steps.synthetic_deploy.conclusion == 'success'
        run: |
          ready=0
          for sample in $(seq 1 18); do
            code=$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' "$PREVIEW_BASE/$ROLLBACK_PROBE")
            printf '%s %s\n' "$sample" "$code" >> rollback-restored.txt
            if test "$code" = 404; then ready=$((ready+1)); else ready=0; fi
            test "$ready" -lt 2 || break
            sleep 5
          done
          test "$ready" = 2
          rm "_site/$ROLLBACK_PROBE"
          sha256sum --check cloudflare/files.sha256
          while read -r digest file; do
            curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_BASE/${file#_site/}" --output "$RUNNER_TEMP/site-object"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/site-object" | sha256sum --check --status
            printf '%s %s\n' "$digest" "${file#_site/}" >> cloudflare-http-proof.txt
          done < cloudflare/files.sha256
          test "$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$PREVIEW_BASE/__migration_missing_t_c60b5646__")" = 404
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloudflare-http-proof
          path: |
            cloudflare-http-proof.txt
            rollback-*.txt
          if-no-files-found: ignore
      - name: Retain preview lifecycle readbacks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-retention-proof
          path: ${{ runner.temp }}/preview-retention-proof.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Refuse stale default-branch promotion
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUDFLARE_SITE_PROMOTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Promote the identical verified artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUDFLARE_SITE_PROMOTED == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b069014f6a46558ea9146fb6c4ff8f6c
          wranglerVersion: '4.151.0'
          command: deploy --config cloudflare/wrangler.json --env production
      - name: Verify canonical production bytes
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUDFLARE_SITE_PROMOTED == 'true'
        run: |
          host=$(node -p 'require("./cloudflare/wrangler.json").env.production.routes[0].pattern')
          while read -r digest file; do
            curl --fail --silent --show-error --location --max-time 30 "https://$host/${file#_site/}" --output "$RUNNER_TEMP/site-object"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/site-object" | sha256sum --check --status
          done < cloudflare/files.sha256
